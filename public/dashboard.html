<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Live Dashboard - Real-time Q&A Board</title>
  <!-- Tailwind CSS CDN -->
  <script src="https://cdn.tailwindcss.com"></script>
  <!-- FontAwesome Icons -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
  <!-- Prism.js Syntax Highlighting -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/prism/1.29.0/themes/prism-tomorrow.min.css">
  <script src="https://cdnjs.cloudflare.com/ajax/libs/prism/1.29.0/prism.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/prism/1.29.0/components/prism-python.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/prism/1.29.0/components/prism-java.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/prism/1.29.0/components/prism-c.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/prism/1.29.0/components/prism-cpp.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/prism/1.29.0/components/prism-javascript.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/prism/1.29.0/components/prism-sql.min.js"></script>
  <!-- Marked.js Markdown parser -->
  <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
  <!-- KaTeX for Math rendering -->
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/katex@0.16.9/dist/katex.min.css">
  <script src="https://cdn.jsdelivr.net/npm/katex@0.16.9/dist/katex.min.js"></script>
  <!-- Custom Stylesheet -->
  <link rel="stylesheet" href="/css/style.css">
</head>
<body class="bg-slate-950 text-slate-100 flex flex-col min-h-screen">
  
  <!-- Header -->
  <header class="border-b border-slate-800/80 bg-slate-900/60 backdrop-blur-md sticky top-0 z-50">
    <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 h-16 flex items-center justify-between">
      <div class="flex items-center gap-3">
        <a href="/" class="w-9 h-9 rounded-xl bg-slate-800/80 hover:bg-slate-700 text-slate-300 flex items-center justify-center transition" title="Back to Launchpad">
          <i class="fa-solid fa-arrow-left"></i>
        </a>
        <div>
          <h1 class="text-base font-bold text-white flex items-center gap-2">
            Live Q&A Board <span class="text-xs px-2 py-0.5 rounded-full bg-violet-500/20 text-violet-300 font-semibold border border-violet-500/30">Unified View</span>
          </h1>
          <p class="text-xs text-slate-400">All questions & solutions synced in real time</p>
        </div>
      </div>

      <div class="flex items-center gap-2 sm:gap-3">
        <!-- Direct Quick Links -->
        <a href="/ask" class="px-3 py-1.5 rounded-lg bg-indigo-950/70 hover:bg-indigo-900 text-indigo-300 text-xs border border-indigo-500/30 flex items-center gap-1.5 transition">
          <i class="fa-solid fa-circle-question"></i> <span class="hidden sm:inline">Ask Question</span>
        </a>
        <a href="/solve" class="px-3 py-1.5 rounded-lg bg-emerald-950/70 hover:bg-emerald-900 text-emerald-300 text-xs border border-emerald-500/30 flex items-center gap-1.5 transition">
          <i class="fa-solid fa-code-branch"></i> <span class="hidden sm:inline">Solve Portal</span>
        </a>

        <!-- Sound Button -->
        <button onclick="SoundManager.toggleMute()" class="p-2 sm:px-3 sm:py-1.5 rounded-lg bg-slate-800/80 hover:bg-slate-700 text-slate-300 text-xs border border-slate-700 transition flex items-center gap-1.5">
          <i class="fa-solid fa-volume-high mute-btn-icon"></i>
        </button>

        <!-- Export Button -->
        <button onclick="exportDataAsMarkdown()" class="px-3 py-1.5 rounded-lg bg-slate-800/80 hover:bg-slate-700 text-slate-300 text-xs border border-slate-700 transition flex items-center gap-1.5" title="Export all solutions as Markdown">
          <i class="fa-solid fa-file-arrow-down"></i> <span class="hidden md:inline">Export</span>
        </button>
      </div>
    </div>
  </header>

  <!-- Main Content -->
  <main class="flex-1 max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 py-6 w-full flex flex-col gap-6">
    
    <!-- Stats Cards -->
    <div class="grid grid-cols-2 sm:grid-cols-4 gap-4">
      <div class="glass-panel p-4 rounded-2xl border border-slate-800 flex items-center gap-3">
        <div class="w-10 h-10 rounded-xl bg-indigo-600/20 border border-indigo-500/30 text-indigo-400 flex items-center justify-center text-lg">
          <i class="fa-solid fa-layer-group"></i>
        </div>
        <div>
          <div class="text-[11px] font-semibold text-slate-400">Total Questions</div>
          <div id="stat-total" class="text-xl font-extrabold text-white">0</div>
        </div>
      </div>

      <div class="glass-panel p-4 rounded-2xl border border-slate-800 flex items-center gap-3">
        <div class="w-10 h-10 rounded-xl bg-amber-600/20 border border-amber-500/30 text-amber-400 flex items-center justify-center text-lg">
          <i class="fa-solid fa-clock"></i>
        </div>
        <div>
          <div class="text-[11px] font-semibold text-slate-400">Pending / In Prog</div>
          <div id="stat-pending" class="text-xl font-extrabold text-amber-300">0</div>
        </div>
      </div>

      <div class="glass-panel p-4 rounded-2xl border border-slate-800 flex items-center gap-3">
        <div class="w-10 h-10 rounded-xl bg-emerald-600/20 border border-emerald-500/30 text-emerald-400 flex items-center justify-center text-lg">
          <i class="fa-solid fa-circle-check"></i>
        </div>
        <div>
          <div class="text-[11px] font-semibold text-slate-400">Solved</div>
          <div id="stat-solved" class="text-xl font-extrabold text-emerald-400">0</div>
        </div>
      </div>

      <div class="glass-panel p-4 rounded-2xl border border-slate-800 flex items-center gap-3">
        <div class="w-10 h-10 rounded-xl bg-violet-600/20 border border-violet-500/30 text-violet-400 flex items-center justify-center text-lg">
          <i class="fa-solid fa-users"></i>
        </div>
        <div>
          <div class="text-[11px] font-semibold text-slate-400">Online Users</div>
          <div id="stat-online" class="text-xl font-extrabold text-violet-300">0</div>
        </div>
      </div>
    </div>

    <!-- Search & Filter Bar -->
    <div class="glass-panel p-4 rounded-2xl border border-slate-800 flex flex-col sm:flex-row items-stretch sm:items-center justify-between gap-3">
      
      <!-- Search input -->
      <div class="relative flex-1 max-w-md">
        <i class="fa-solid fa-magnifying-glass absolute left-3.5 top-1/2 -translate-y-1/2 text-slate-500 text-xs"></i>
        <input 
          type="text" 
          id="dashboard-search" 
          placeholder="Search question title, text, code, or tags..." 
          class="w-full text-xs pl-9 pr-3 py-2.5 rounded-xl glass-input bg-slate-900 border-slate-700"
          oninput="handleSearch(event)"
        >
      </div>

      <!-- Filter Tabs -->
      <div class="flex items-center gap-1.5 bg-slate-900/80 p-1 rounded-xl border border-slate-800 text-xs self-start sm:self-auto">
        <button onclick="setDashFilter('all')" class="dash-filter-btn px-3 py-1 rounded-lg bg-indigo-600 text-white font-semibold" data-filter="all">All</button>
        <button onclick="setDashFilter('pending')" class="dash-filter-btn px-3 py-1 rounded-lg text-slate-400 hover:text-white" data-filter="pending">Pending</button>
        <button onclick="setDashFilter('in_progress')" class="dash-filter-btn px-3 py-1 rounded-lg text-slate-400 hover:text-white" data-filter="in_progress">In Progress</button>
        <button onclick="setDashFilter('solved')" class="dash-filter-btn px-3 py-1 rounded-lg text-slate-400 hover:text-white" data-filter="solved">Solved</button>
      </div>
    </div>

    <!-- Live Board Feed -->
    <div id="dashboard-feed" class="space-y-4">
      <div id="dashboard-empty-state" class="p-16 text-center rounded-2xl glass-panel border border-slate-800 flex flex-col items-center justify-center gap-3">
        <div class="w-16 h-16 rounded-2xl bg-slate-800/80 flex items-center justify-center text-slate-500 text-2xl">
          <i class="fa-solid fa-table-list"></i>
        </div>
        <div class="text-base font-bold text-white">No Questions in Session</div>
        <p class="text-xs text-slate-400 max-w-sm">When your friend asks a question or the solver submits an answer, all updates appear here live.</p>
      </div>
    </div>

  </main>

  <!-- Scripts -->
  <script src="/socket.io/socket.io.js"></script>
  <script src="/js/common.js"></script>
  <script src="/js/dashboard.js"></script>
</body>
</html>
